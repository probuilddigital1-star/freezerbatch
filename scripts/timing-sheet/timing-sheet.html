<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freezer Batch Cocktails — batch timing sheet</title>
<!--
  Print artifact: how long each batch stays at its best.

  This file deliberately contains NO recipe data and NO durations. Every row is
  injected at render time by scripts/generate-batch-timing.mjs, which reads
  src/data/cocktails.json — the same storage.* blocks the site renders from. That
  is the whole point: the sheet cannot contradict the site, and re-running the
  generator is the only step needed after a storage value changes.

  Opening this file directly shows an empty shell. That is intended — if the data
  lived here it could drift, which is exactly the defect the storage schema exists
  to prevent.

  Print geometry matches the label sheet: US Letter, 0.5in margins carried by the
  sheet's own padding under @page { margin: 0 }, so the browser stamps no header.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  @page { size: Letter; margin: 0; }

  html, body { margin: 0; padding: 0; }

  body {
    background: #fdfcf9;
    font-family: Outfit, Helvetica, Arial, sans-serif;
    color: #2b2620;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sheet {
    width: 8.5in;
    height: 11in;
    box-sizing: border-box;
    padding: 0.5in;
    background: #fdfcf9;
    display: flex;
    flex-direction: column;
  }

  /* Masthead */
  .masthead { border-bottom: 1.5px solid #3a352c; padding-bottom: 0.13in; margin-bottom: 0.2in; }
  .rule-accent { width: 0.44in; height: 1.5px; background: #c8a55c; margin-bottom: 0.09in; }
  .title {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight: 500;
    font-size: 25pt;
    letter-spacing: 0.02em;
    margin: 0 0 0.04in;
    line-height: 1.05;
  }
  .subtitle { font-size: 8.5pt; color: #6b6355; line-height: 1.45; max-width: 6.1in; }

  .groups { flex: 1; }

  .group { margin-bottom: 0.3in; }
  .group-head {
    display: flex;
    align-items: baseline;
    gap: 0.1in;
    border-bottom: 1px solid #b6ad9c;
    padding-bottom: 0.05in;
    margin-bottom: 0.07in;
  }
  .group-label {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 14pt;
    font-weight: 600;
    color: #2b2620;
  }
  .group-count { font-size: 7pt; letter-spacing: 0.16em; color: #8d846f; text-transform: uppercase; }

  .row { display: flex; align-items: baseline; gap: 0.1in; padding: 0.082in 0; }
  .row + .row { border-top: 1px dotted #ddd6c8; }
  .name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 11.5pt;
    font-weight: 600;
    width: 1.55in;
    flex-shrink: 0;
    line-height: 1.15;
  }
  .limited {
    font-size: 6.5pt;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: #8a6f2e;
    border: 1px solid #d8c79a;
    padding: 0.012in 0.045in;
    width: 0.62in;
    flex-shrink: 0;
    text-align: center;
    line-height: 1.3;
  }
  .limited.none { color: #b0a795; border-color: #e4ddcf; }
  .note { font-size: 8pt; color: #4a443a; line-height: 1.35; flex: 1; }

  .footer {
    border-top: 1px solid #b6ad9c;
    padding-top: 0.08in;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 7pt;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8d846f;
  }
  .footer .site { color: #8a6f2e; }
</style>
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <div class="rule-accent"></div>
    <h1 class="title">Batch timing</h1>
    <div class="subtitle">How long each batch stays at its best in the freezer. This is a flavour window, not a safety one — nothing here spoils, it fades. Where a single ingredient sets the clock, it is named.</div>
  </div>

  <div class="groups"><!-- GROUPS --></div>

  <div class="footer">
    <span>Freezer Batch Cocktails</span>
    <span class="site">freezerbatchcocktails.com</span>
  </div>
</div>
</body>
</html>
