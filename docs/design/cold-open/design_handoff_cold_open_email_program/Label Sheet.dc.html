<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
doc-page:not(:defined) { visibility:hidden; }
body { margin:0; }
a { color:#8a6f2e; } a:hover { color:#5c4f2e; }
</style>
<script src="./doc-page.js"></script>
</helmet>
<doc-page>
  <section class="page" id="p1" style="background:#fdfcf9; box-sizing:border-box; padding:0.5in; font-family:Outfit, Helvetica, Arial, sans-serif; color:#2b2620;">
    <div style="width:7.5in; height:10in; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr 1fr; gap:0.18in 0.2in; box-sizing:border-box;">
      <sc-for list="{{ labels }}" as="n" hint-placeholder-count="6">
        <div style="border:1px dashed #b6ad9c; box-sizing:border-box; padding:0.22in 0.25in; display:flex; flex-direction:column; justify-content:space-between; position:relative; background:#ffffff;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.15in;">
            <div style="flex:1; display:flex; flex-direction:column; gap:0.02in;">
              <div style="border-bottom:1.5px solid #3a352c; height:0.5in;"></div>
              <div style="font-size:7pt; letter-spacing:0.18em; color:#8d846f; text-transform:uppercase;">Cocktail</div>
            </div>
            <div style="background:#c8a55c; border:1px solid #a8863f; font-family:'Cormorant Garamond', Georgia, serif; font-size:10pt; font-weight:600; letter-spacing:0.08em; padding:2pt 6pt 1pt; color:#161310;">FBC</div>
          </div>
          <div style="display:flex; gap:0.25in; align-items:flex-end;">
            <div style="flex:1; display:flex; flex-direction:column; gap:0.13in;">
              <div style="display:flex; flex-direction:column; gap:0.02in;">
                <div style="display:flex; align-items:baseline; gap:0.08in;">
                  <span style="font-size:8pt; color:#3a352c; white-space:nowrap;">batched on</span>
                  <span style="flex:1; border-bottom:1px solid #3a352c; height:0.22in;"></span>
                </div>
              </div>
              <div style="display:flex; align-items:baseline; gap:0.08in;">
                <span style="font-size:8pt; color:#3a352c; white-space:nowrap;">ABV</span>
                <span style="width:0.5in; border-bottom:1px solid #3a352c; height:0.22in;"></span>
                <span style="font-size:8pt; color:#3a352c;">%</span>
              </div>
              <div style="display:flex; align-items:baseline; gap:0.08in;">
                <span style="font-size:8pt; color:#3a352c; white-space:nowrap;">serve: pour</span>
                <span style="width:0.4in; border-bottom:1px solid #3a352c; height:0.22in;"></span>
                <span style="font-size:8pt; color:#3a352c; white-space:nowrap;">oz · glass</span>
                <span style="flex:1; border-bottom:1px solid #3a352c; height:0.22in;"></span>
              </div>
              <div style="display:flex; align-items:center; gap:0.07in;">
                <span style="width:0.14in; height:0.14in; border:1.5px solid #3a352c; display:inline-block;"></span>
                <span style="font-size:8pt; color:#3a352c;">stir / shake before pouring</span>
              </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center; gap:0.04in;">
              <div style="width:1in; height:1in; border:1px solid #b6ad9c; display:flex; align-items:center; justify-content:center; background:repeating-linear-gradient(45deg, #ffffff, #ffffff 4px, #f2eee6 4px, #f2eee6 8px);">
                <span style="font-family:'Courier New', monospace; font-size:6.5pt; color:#8d846f; text-align:center;">QR<br>recipe link</span>
              </div>
              <div style="font-size:6.5pt; letter-spacing:0.14em; color:#8d846f; text-transform:uppercase;">Scan for recipe</div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </section>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return { labels: [1, 2, 3, 4, 5, 6] }; }
}
</script>
</body>
</html>
